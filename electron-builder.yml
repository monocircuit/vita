appId: com.monocircuit.vita
productName: Vita
copyright: Copyright © 2026 monocircuit

directories:
  output: release
  buildResources: build

files:
  - electron/**/*.js
  - electron/**/*.js.map
  - electron/db/migrations/*.sql
  - dist/**/*
  - package.json
  - "!**/*.{ts,tsx}"
  - "!**/tsconfig*.json"
  - "!node_modules/next/**"
  - "!node_modules/@next/**"
  - "!node_modules/rolldown/**"
  - "!node_modules/@rolldown/**"
  - "!node_modules/sharp/**"
  - "!node_modules/@img/**"
  - "!node_modules/lightningcss-*/**"

linux:
  target:
    - AppImage
  category: Utility

mac:
  target:
    - target: dmg
      arch: [arm64]
  category: public.app-category.productivity

win:
  target:
    - nsis

publish:
  provider: github
  owner: monocircuit
  repo: vita
  releaseType: draft
