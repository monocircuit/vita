name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate icons manifest
        run: pnpm icons:generate

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm exec tsc --noEmit

      - name: Build renderer (Vite)
        run: pnpm build

      - name: Build main (tsc)
        run: pnpm build:electron

      - name: Build electron bundle (unpacked)
        run: pnpm exec electron-builder --dir --publish never

      - name: Verify build
        run: node scripts/verify-build.mjs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vita-${{ matrix.os }}-${{ github.sha }}
          path: release/
          retention-days: 7
          if-no-files-found: error
